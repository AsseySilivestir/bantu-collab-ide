<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splannes Thumb Pal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closetag.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="sidebar">
            <div id="brand">
                <div class="logo">STP</div>
                <div class="brand-text">
                    <h1>Splannes Thumb Pal</h1>
                    <span class="brand-sub">Collaborative IDE</span>
                </div>
            </div>
            <div id="profile">
                <div class="avatar" id="my-avatar">?</div>
                <input type="text" id="name-input" placeholder="Your name" maxlength="20">
                <div class="conn-status" id="conn-status">
                    <span class="dot disconnected"></span>
                    <span class="conn-text">Connecting...</span>
                </div>
            </div>
            <div id="users-section">
                <div class="section-header">
                    <h3>Online</h3>
                    <span class="user-count" id="user-count">0</span>
                </div>
                <div id="users-list"></div>
            </div>
            <div id="chat-section">
                <div class="section-header"><h3>Chat</h3></div>
                <div id="chat-messages"></div>
                <div id="chat-input-bar">
                    <input type="text" id="chat-input" placeholder="Message..." maxlength="500">
                    <button id="chat-send" title="Send">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                    </button>
                    <button id="record-btn" class="record-btn" title="Hold to record voice message">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg>
                    </button>
                </div>
            </div>
        </div>
        <div id="main">
            <div id="editor-header">
                <div class="editor-tabs">
                    <div class="tab active" id="code-tab">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                        Code Editor
                    </div>
                    <div class="tab" id="preview-tab">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        Preview
                    </div>
                </div>
                <div class="editor-actions">
                    <select id="language-select">
                        <option value="javascript">JavaScript</option>
                        <option value="python">Python</option>
                        <option value="htmlmixed">HTML</option>
                        <option value="css">CSS</option>
                    </select>
                </div>
            </div>
            <div id="editor-wrapper"><textarea id="code-editor"></textarea></div>
            <div id="preview-wrapper" style="display:none;"><iframe id="preview-frame" sandbox="allow-scripts"></iframe></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
